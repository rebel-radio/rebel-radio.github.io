<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:#eee;
    font-family:Arial,Helvetica,sans-serif;
}

.navegacion{
    padding:18px 20px;
    text-align:center;
    border-bottom:1px solid #333;
}

.navegacion a{
    color:#ddd;
    text-decoration:none;
    margin:0 12px;
    font-size:.9rem;
    font-weight:bold;
}

.navegacion a:hover{
    color:#fff;
}

.contenedor{
    max-width:1100px;
    margin:auto;
    padding:35px 20px 60px;
}

h1{
    margin-bottom:8px;
}

.intro{
    color:#aaa;
    margin-top:0;
    margin-bottom:35px;
}

.lista{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:22px;
}

.programa{
    background:#1b1b1b;
    border:1px solid #333;
    border-radius:10px;
    overflow:hidden;
}

.portada{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}

.contenido{
    padding:18px;
}

.nombre-programa{
    margin:0 0 10px;
    font-size:1.25rem;
}

.detalle{
    color:#aaa;
    margin:0 0 16px;
}

.ver-programa{
    display:inline-block;
    color:#fff;
    font-weight:bold;
    text-decoration:none;
}

.ver-programa:hover{
    text-decoration:underline;
}

.estado{
    color:#aaa;
}

@media(max-width:650px){
    .navegacion a{
        margin:0 6px;
        font-size:.78rem;
    }

    .contenedor{
        padding:25px 15px 45px;
    }
}


/* =========================================================
   MENU SUPERIOR COMUN REBEL RADIO
   ========================================================= */

nav,
.navegacion{
    display:flex;
    justify-content:center;
    flex-wrap:nowrap !important;
    gap:6px !important;
    align-items:center;
}

.cabecera{
    display:flex;
    justify-content:center !important;
}

nav a,
.navegacion a{
    margin:0 !important;
    padding:7px 9px;
    box-sizing:border-box;
    border:1px solid #333;
    border-radius:8px;
    background:#171717;
    color:#ccc;
    text-decoration:none;
    font-size:15px !important;
    font-weight:700;
    line-height:1.2;
    white-space:nowrap;
    flex:0 0 auto;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
}

nav a:hover,
.navegacion a:hover{
    background:#242424;
    border-color:#555;
    color:#fff;
}

nav a.activo,
.navegacion a.activo{
    color:#e0a052;
    border-color:#d08a2f;
    background:rgba(208,138,47,.12);
}

@media (max-width:700px){
    nav,
    .navegacion{
        justify-content:center !important;
        gap:4px !important;
        max-width:100%;
        overflow-x:auto;
        scrollbar-width:none;
        -webkit-overflow-scrolling:touch;
    }

    nav::-webkit-scrollbar,
    .navegacion::-webkit-scrollbar{
        display:none;
    }

    nav a,
    .navegacion a{
        padding:6px clamp(5px,1.5vw,7px);
        font-size:clamp(11px,3vw,12.5px) !important;
    }
}



/* REBEL-CABECERA-FIJA-INICIO */

header{
    margin:0 !important;
    padding:12px 16px !important;
    min-height:58px !important;
    height:58px !important;
    box-sizing:border-box !important;
    display:flex !important;
    align-items:center !important;
    justify-content:center !important;
    overflow:visible !important;
    background:#111 !important;
    border:0 !important;
    border-bottom:1px solid #2b2b2b !important;
}

header .cabecera{
    width:100% !important;
    max-width:100% !important;
    height:100% !important;
    min-width:0 !important;
    margin:0 !important;
    padding:0 !important;
    box-sizing:border-box !important;
    display:flex !important;
    align-items:center !important;
    justify-content:center !important;
    gap:0 !important;
}

header nav,
header .navegacion{
    width:auto !important;
    max-width:100% !important;
    min-width:0 !important;
    margin:0 auto !important;
    padding:0 !important;
    box-sizing:border-box !important;
    display:flex !important;
    align-items:center !important;
    justify-content:center !important;
    flex-wrap:nowrap !important;
    gap:6px !important;
    border:0 !important;
}

header nav a,
header .navegacion a{
    flex:0 0 auto !important;
    margin:0 !important;
}

@media (max-width:700px){
    header{
        padding:10px 0 !important;
        min-height:54px !important;
        height:54px !important;
        overflow:hidden !important;
    }

    header .cabecera{
        width:100% !important;
        max-width:100% !important;
        height:100% !important;
        min-width:0 !important;
    }

    header nav,
    header .navegacion{
        width:100% !important;
        max-width:100% !important;
        min-width:0 !important;
        margin:0 !important;
        padding:0 8px !important;
        justify-content:flex-start !important;
        overflow-x:auto !important;
        overflow-y:hidden !important;
        scroll-padding-left:8px !important;
        scrollbar-width:none !important;
        -webkit-overflow-scrolling:touch;
    }

    header nav::-webkit-scrollbar,
    header .navegacion::-webkit-scrollbar{
        display:none !important;
    }

    header nav a:first-child,
    header .navegacion a:first-child{
        margin-left:0 !important;
    }

    header nav a:last-child,
    header .navegacion a:last-child{
        margin-right:8px !important;
    }
}

/* REBEL-CABECERA-FIJA-FIN */

<header class="rr-header">

<main class="contenedor">

    <h1>Archivo de programas</h1>

    <p class="intro">
        Programas anteriores de Rebel Radio que puedes seguir escuchando.
    </p>

    <div id="estado" class="estado">
        Cargando archivo...
    </div>

    <div id="lista" class="lista"></div>

</main>

<script>
const lista = document.getElementById('lista');
const estado = document.getElementById('estado');

fetch('archivo-mixcloud.json')
    .then(respuesta => {
        if(!respuesta.ok){
            throw new Error('No se puede cargar el archivo');
        }

        return respuesta.json();
    })

    .then(archivo => {

        const anteriores =
            archivo.programas.filter(programa => programa.activo === false);

        estado.style.display = 'none';

        for(const programa of anteriores){

            if(!programa.episodios.length){
                continue;
            }

            const episodio = programa.episodios[0];

            const seccion = document.createElement('section');
            seccion.className = 'programa';

            seccion.innerHTML = `
                <img
                    class="portada"
                    src="${episodio.imagen}"
                    alt="${programa.nombre}"
                >

                <div class="contenido">

                    <h2 class="nombre-programa">
                        ${programa.nombre}
                    </h2>

                    <p class="detalle">
                        ${programa.episodios.length} episodios disponibles
                    </p>

                    <a
                        class="ver-programa"
                        href="programa.html?id=${programa.id}">
                        Ver todos los episodios →
                    </a>

                </div>
            `;

            lista.appendChild(seccion);
        }
    })

    .catch(error => {
        estado.textContent =
            'No se ha podido cargar el archivo de programas.';

        console.error(error);
    });
</script>
