<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Programas - Rebel Radio</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

main{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:25px 20px 50px;
}

.navegacion{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

.navegacion a{
    color:#ccc;
    text-decoration:none;
    font-size:.9rem;
}

.navegacion a:hover{
    color:white;
}

h1{
    text-align:center;
    margin:0 0 10px;
    font-size:2rem;
}

.intro{
    text-align:center;
    color:#aaa;
    margin:0 auto 35px;
}

#estado{
    text-align:center;
    color:#aaa;
    margin:30px 0;
}

#lista{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:24px;
    align-items:start;
}

.programa{
    min-width:0;
}

.tarjeta{
    background:#1c1c1c;
    border:1px solid #333;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease;
}

.tarjeta:hover{
    transform:translateY(-2px);
    border-color:#555;
}

.portada{
    width:100%;
    aspect-ratio:1 / 1;
    object-fit:cover;
    display:block;
}

.contenido{
    padding:16px;
}

.nombre-programa{
    margin:0 0 12px;
    font-size:1.25rem;
    line-height:1.25;
}

.ultimo{
    margin:0 0 6px;
    color:#ddd;
    font-size:.95rem;
}

.detalle{
    margin:4px 0;
    color:#999;
    font-size:.85rem;
}

.escuchar{
    display:inline-block;
    margin-top:12px;
    font-weight:bold;
    font-size:.9rem;
}

.ver-programa{
    display:block;
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid #333;
    color:white;
    text-decoration:none;
    font-weight:bold;
    font-size:.9rem;
}

.ver-programa:hover{
    text-decoration:underline;
}

.reproductor{
    display:block;
    width:100%;
    margin-top:12px;
    border:0;
}

.nombre-programa-movil{
    display:none;
}

@media (max-width:600px){

    main{
        padding:20px 15px 40px;
    }

    #lista{
        grid-template-columns:1fr;
        gap:12px;
    }

    .tarjeta{
        display:grid;
        grid-template-columns:50% 50%;
        align-items:start;
    }

    .nombre-programa-movil{
        display:block;
        grid-column:1 / -1;
        grid-row:1;
        margin:0;
        padding:10px 12px;
        color:#d08a2f;
        font-size:1.08rem;
        font-weight:800;
        line-height:1.25;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    .nombre-programa-escritorio{
        display:none;
    }

    .portada{
        grid-column:1;
        grid-row:2;
        width:100%;
        aspect-ratio:1 / 1;
        object-fit:cover;
    }

    .contenido{
        grid-column:2;
        grid-row:2;
        min-width:0;
        padding:12px;
    }

    .tarjeta-sin-portada .contenido{
        grid-column:1 / -1;
    }

    .ultimo{
        font-size:.85rem;
    }

    .detalle{
        font-size:.78rem;
    }
}

@media (max-width:380px){

    #lista{
        grid-template-columns:1fr;
    }
}


/* =========================================================
   MENU SUPERIOR COMUN REBEL RADIO
   ========================================================= */

nav,
.navegacion{
    display:flex;
    justify-content:center;
    flex-wrap:nowrap !important;
    gap:6px !important;
    align-items:center;
}

.cabecera{
    display:flex;
    justify-content:center !important;
}

nav a,
.navegacion a{
    margin:0 !important;
    padding:7px 9px;
    box-sizing:border-box;
    border:1px solid #333;
    border-radius:8px;
    background:#171717;
    color:#ccc;
    text-decoration:none;
    font-size:15px !important;
    font-weight:700;
    line-height:1.2;
    white-space:nowrap;
    flex:0 0 auto;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
}

nav a:hover,
.navegacion a:hover{
    background:#242424;
    border-color:#555;
    color:#fff;
}

nav a.activo,
.navegacion a.activo{
    color:#e0a052;
    border-color:#d08a2f;
    background:rgba(208,138,47,.12);
}

@media (max-width:700px){
    nav,
    .navegacion{
        justify-content:center !important;
        gap:4px !important;
        max-width:100%;
        overflow-x:auto;
        scrollbar-width:none;
        -webkit-overflow-scrolling:touch;
    }

    nav::-webkit-scrollbar,
    .navegacion::-webkit-scrollbar{
        display:none;
    }

    nav a,
    .navegacion a{
        padding:6px clamp(5px,1.5vw,7px);
        font-size:clamp(11px,3vw,12.5px) !important;
    }
}

<main>



<h1>PROGRAMAS</h1>

<p class="intro">
Últimos programas de Rebel Radio
</p>

<p id="estado">Cargando programas...</p>

<div id="lista"></div>

</main>

<script>
const lista = document.getElementById('lista');
const estado = document.getElementById('estado');

function duracion(segundos){
    const minutos = Math.floor(segundos / 60);
    const horas = Math.floor(minutos / 60);
    const resto = minutos % 60;

    if(horas > 0){
        return `${horas} h ${resto} min`;
    }

    return `${minutos} min`;
}

function fechaVisible(fecha){
    if(!fecha){
        return '';
    }

    const [anio, mes, dia] = fecha.split('-');
    return `${dia}/${mes}/${anio}`;
}

function reproductorMixcloud(key){
    return `
        <iframe
            class="reproductor"
            height="120"
            frameborder="0"
            src="https://player-widget.mixcloud.com/widget/iframe/?hide_cover=1&mini=1&feed=${encodeURIComponent(key)}"
            allow="autoplay">
        </iframe>
    `;
}

function reproductorIvoox(player){
    return `
        <iframe
            class="reproductor"
            src="${player}"
            width="100%"
            height="200"
            frameborder="0"
            allowfullscreen
            scrolling="no"
            loading="lazy">
        </iframe>
    `;
}

fetch('catalogo-mixcloud.json')
    .then(respuesta => {

        if(!respuesta.ok){
            throw new Error('No se puede cargar el catálogo');
        }

        return respuesta.json();
    })

    .then(catalogo => {

        estado.style.display = 'none';

        for(const programa of catalogo.programas){

            if(!programa.episodios.length){

                const soloDirecto =
                    programa.proveedor === 'directo' ||
                    programa.estado === 'solo_directo';

                const destino =
                    programa.proveedor === 'ivoox'
                        ? 'iVoox'
                        : 'Mixcloud';

                const mensajePrincipal =
                    soloDirecto
                        ? 'Solo en directo'
                        : 'Podcast pendiente';

                const mensajeDetalle =
                    soloDirecto
                        ? 'No disponible como podcast'
                        : `Próximamente en ${destino}`;

                const seccion =
                    document.createElement('section');

                seccion.className =
                    'programa';

                seccion.innerHTML = `
                    <div class="tarjeta tarjeta-sin-portada">

                        <h2 class="nombre-programa nombre-programa-movil">
                            ${programa.nombre}
                        </h2>

                        <div class="contenido">

                            <h2 class="nombre-programa nombre-programa-escritorio">
                                ${programa.nombre}
                            </h2>

                            <p class="ultimo">
                                ${mensajePrincipal}
                            </p>

                            <p class="detalle">
                                ${mensajeDetalle}
                            </p>

                            <a
                                class="ver-programa"
                                href="programa.html?id=${programa.id}">
                                Ver ficha →
                            </a>

                        </div>

                    </div>
                `;

                lista.appendChild(seccion);

                continue;
            }

            const episodio = programa.episodios[0];

            const seccion = document.createElement('section');
            seccion.className = 'programa';

            const subtitulo =
                episodio.titulo
                    ? `${fechaVisible(episodio.fecha)} · ${episodio.titulo}`
                    : fechaVisible(episodio.fecha);

            seccion.innerHTML = `
                <div class="tarjeta">

                    <h2 class="nombre-programa nombre-programa-movil">
                        ${programa.nombre}
                    </h2>

                    <img
                        class="portada"
                        src="${episodio.imagen}"
                        alt="${programa.nombre}"
                    >

                    <div class="contenido">

                        <h2 class="nombre-programa nombre-programa-escritorio">
                            ${programa.nombre}
                        </h2>

                        <p class="ultimo">
                            ${subtitulo}
                        </p>

                        <p class="detalle">
                            ${duracion(episodio.duracion)}
                        </p>

                        ${episodio.reproducciones !== null
                            ? `<p class="detalle">
                                ▶ ${episodio.reproducciones} reproducciones
                               </p>`
                            : ''
                        }

                        <span class="escuchar">
                            ▶ Escuchar último programa
                        </span>

                        <a
                            class="ver-programa"
                            href="programa.html?id=${programa.id}">
                            Ver todos los episodios →
                        </a>

                    </div>

                </div>
            `;

            const tarjeta =
                seccion.querySelector('.tarjeta');

            tarjeta.dataset.programaId =
                programa.id || '';

            tarjeta.dataset.episodioId =
                episodio.key || episodio.player || episodio.fecha || '';

            tarjeta.dataset.episodioFecha =
                episodio.fecha || '';

            tarjeta.dataset.episodioTitulo =
                episodio.titulo || '';

            tarjeta.dataset.proveedor =
                episodio.proveedor || programa.proveedor || '';

            tarjeta.addEventListener('click', (evento) => {

                if(evento.target.closest('.ver-programa')){
                    return;
                }

                const existente =
                    seccion.querySelector('.reproductor');

                if(existente){
                    existente.remove();
                    return;
                }

                document
                    .querySelectorAll('.reproductor')
                    .forEach(reproductor => reproductor.remove());

                const reproductor =
                    programa.proveedor === 'ivoox'
                        ? reproductorIvoox(episodio.player)
                        : reproductorMixcloud(episodio.key);

                seccion.insertAdjacentHTML(
                    'beforeend',
                    reproductor
                );
            });

            lista.appendChild(seccion);
        }

        // ACCESO AL ARCHIVO DE PROGRAMAS
        const archivo = document.createElement('div');
        archivo.innerHTML = `
            <div style="
                margin-top:3rem;
                padding-top:1.5rem;
                border-top:1px solid rgba(255,255,255,.15);
            ">
                <h2 style="margin-bottom:.4rem;">
                    ARCHIVO DE PROGRAMAS
                </h2>

                <p style="opacity:.75; margin-top:0; margin-bottom:.8rem;">
                    Programas anteriores de Rebel Radio que puedes seguir escuchando.
                </p>

                <a
                    class="ver-programa"
                    href="programas-anteriores.html">
                    Ver programas anteriores →
                </a>
            </div>
        `;

        lista.appendChild(archivo);
    })

    .catch(error => {

        estado.textContent =
            'No se han podido cargar los programas.';

        console.error(error);
    });
</script>
