<script>
function crearPersona(persona) {
    const tarjeta = document.createElement("article");
    tarjeta.className = "persona";

    const foto = document.createElement("div");
    foto.className = "foto";

    if (persona.foto) {
        const img = document.createElement("img");
        img.src = persona.foto;
        img.alt = persona.nombre;
        img.loading = "lazy";
        foto.appendChild(img);
    } else {
        foto.textContent = "FOTO";
    }

    const datos = document.createElement("div");
    datos.className = "datos";

    const nombre = document.createElement("div");
    nombre.className = "nombre";
    nombre.textContent = persona.nombre;
    datos.appendChild(nombre);

    if (persona.programa) {
        const programa = document.createElement("div");
        programa.className = "programa";
        programa.textContent = persona.programa;
        datos.appendChild(programa);
    }

    if (persona.nota) {
        const nota = document.createElement("div");
        nota.className = "nota";
        nota.textContent = persona.nota;
        datos.appendChild(nota);
    }

    tarjeta.appendChild(foto);
    tarjeta.appendChild(datos);

    return tarjeta;
}

fetch("/personas.json", { cache: "no-store" })
    .then(respuesta => {
        if (!respuesta.ok) {
            throw new Error("No se pudo cargar personas.json");
        }
        return respuesta.json();
    })
    .then(datos => {
        const equipo = document.getElementById("equipo");

        (datos.equipo || []).forEach(persona => {
            equipo.appendChild(crearPersona(persona));
        });

        if (datos.colaboradores && datos.colaboradores.length) {
            const seccion = document.getElementById("seccion-colaboradores");
            const colaboradores = document.getElementById("colaboradores");

            datos.colaboradores.forEach(persona => {
                colaboradores.appendChild(crearPersona(persona));
            });

            seccion.style.display = "block";
        }
    })
    .catch(error => {
        console.error(error);
    });
</script>
